# CI/CD demo workflow
# ─────────────────────────────────────────────────────────────────────────────
# Job 1 (ci-demo-tests): runs Jest E2E tests for the ci-demo/ Node.js app.
#   • No database needed — data lives in an in-memory store.
#   • Generates a JUnit XML report and publishes it as a "Jest E2E Report"
#     tab on every PR via dorny/test-reporter.
#
# Job 2 (backend-tests): spins up a MySQL 8 service container and runs the
#   existing backend integration scripts.
# ─────────────────────────────────────────────────────────────────────────────

name: CI Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Required so dorny/test-reporter can write check runs on PRs
permissions:
  checks: write
  contents: read

jobs:
  # ── Job 1: ci-demo Jest E2E tests (no DB) ──────────────────────────────────
  ci-demo-tests:
    name: CI Demo — Jest E2E (no DB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ci-demo dependencies
        working-directory: ci-demo
        run: npm install

      - name: Run Jest E2E tests
        working-directory: ci-demo
        run: npm test

      # Always upload the XML even when tests fail so we can see what broke
      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-junit-results
          path: ci-demo/test-results/junit.xml

      # Publishes a "Jest E2E Report" tab directly on the PR / commit check
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Jest E2E Report
          path: ci-demo/test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false

  # ── Job 2: backend integration tests (MySQL service container) ─────────────
  backend-tests:
    name: Backend Integration Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Admin123!
          MYSQL_DATABASE: menaxhimi_pacienteve
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Wait for MySQL to be ready
        run: |
          sudo apt-get install -y default-mysql-client
          for i in {1..30}; do
            mysql -h 127.0.0.1 -uroot -p'Admin123!' -e "SELECT 1" 2>/dev/null && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Write CI .env
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          DB_HOST=127.0.0.1
          DB_USER=root
          DB_PASSWORD=Admin123!
          DB_NAME=menaxhimi_pacienteve
          JWT_SECRET=ci-test-secret-12345
          REFRESH_SECRET=ci-refresh-secret-12345
          JWT_EXPIRES_IN=15m
          REFRESH_EXPIRES_IN=7d
          PORT=5000
          NODE_ENV=test
          CLIENT_ORIGIN=http://localhost:5174
          FRONTEND_URL=http://localhost:5174
          STRIPE_SECRET_KEY=sk_test_dummy
          EOF

      - name: Run database migrations
        working-directory: backend
        run: npx sequelize-cli db:migrate

      - name: Seed demo users
        working-directory: backend
        run: npx sequelize-cli db:seed --seed 20260617000000-seed-demo-users.js

      - name: Start backend server
        working-directory: backend
        run: nohup node server.js > server.log 2>&1 &

      - name: Wait for server to be ready
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:5000/api/health && break
            echo "Waiting for server... ($i)"
            sleep 2
          done

      - name: Run integration tests
        working-directory: backend
        run: node status_check_all15.js || true

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-server-log
          path: backend/server.log
